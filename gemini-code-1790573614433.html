<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆★약속 거절 핑계 추천★☆</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@700&display=swap');

        :root {
            --neon-yellow: #ffff00;
            --neon-green: #00ff00;
            --hot-pink: #ff007f;
            --deep-red: #cc0000;
        }

        body {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop') center/cover fixed;
            color: #ffffff;
            font-family: 'Gowun Batang', serif;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(0, 0, 0, 0.75);
            border: 4px dashed var(--neon-yellow);
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 255, 0, 0.5), inset 0 0 15px rgba(255, 0, 127, 0.5);
            border-radius: 15px;
            text-align: center;
        }

        h1 {
            font-family: 'East Sea Dokdo', cursive;
            font-size: 3rem;
            color: var(--neon-yellow);
            text-shadow: 
                3px 3px 0px var(--deep-red),
                -2px -2px 0px #000,
                0 0 15px var(--hot-pink);
            margin: 10px 0;
            letter-spacing: 2px;
            animation: blink 1.5s infinite alternate;
        }

        @keyframes blink {
            0% { opacity: 0.9; text-shadow: 3px 3px 0px var(--deep-red), 0 0 10px var(--hot-pink); }
            100% { opacity: 1; text-shadow: 3px 3px 0px #0000ff, 0 0 25px var(--neon-green); }
        }

        p.quote {
            font-size: 1.1rem;
            color: #ffffff;
            background: rgba(255, 0, 127, 0.3);
            padding: 8px;
            border-radius: 20px;
            border: 1px solid var(--hot-pink);
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px #000;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }

        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--neon-green);
            text-shadow: 1px 1px 2px #000;
            margin-bottom: 6px;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #000;
            color: #fff;
            border: 2px solid var(--neon-yellow);
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        button.btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(180deg, #ff7675, #d63031);
            color: var(--neon-yellow);
            font-family: 'East Sea Dokdo', cursive;
            font-size: 2.2rem;
            border: 3px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            text-shadow: 2px 2px 0px #000;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.6);
            transition: transform 0.1s;
        }

        button.btn-submit:active {
            transform: scale(0.98);
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-title-banner {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            background: var(--deep-red);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid var(--neon-yellow);
            text-shadow: 1px 1px 2px #000;
        }

        .result-card {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid var(--neon-green);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .rank-badge {
            position: absolute;
            top: -12px;
            right: 10px;
            background: var(--hot-pink);
            color: #fff;
            font-family: 'East Sea Dokdo', cursive;
            font-size: 1.4rem;
            padding: 2px 12px;
            border-radius: 15px;
            border: 2px solid #fff;
            text-shadow: 1px 1px 1px #000;
        }

        .reason-category {
            color: var(--neon-yellow);
            font-size: 0.85rem;
            font-weight: bold;
        }

        .reason-title {
            font-size: 1.2rem;
            color: #fff;
            margin: 5px 0;
            text-shadow: 1px 1px 2px var(--deep-red);
        }

        .reason-desc {
            font-size: 0.85rem;
            color: #dfe6e9;
            margin-bottom: 10px;
        }

        .template-box {
            background: #1e1e1e;
            border: 2px dotted var(--neon-yellow);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: #fff;
            white-space: pre-wrap;
        }

        .btn-copy {
            margin-top: 10px;
            background: var(--neon-yellow);
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            float: right;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .btn-copy:hover {
            background: #fff;
        }

        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✿ 거절도 예술이다람쥐 ✿</h1>
    <p class="quote">"영원하지 않기에 아름다운 약속... 오늘은 쉬어가세요..." 🌸</p>

    <div class="form-grid">
        <div class="form-group">
            <label for="time">1. 약속 시간대</label>
            <select id="time">
                <option value="1">1. 약속 한 달 전</option>
                <option value="2">2. 약속 1~2주 전</option>
                <option value="3">3. 약속 2~4일 전</option>
                <option value="4">4. 약속 1일 전</option>
                <option value="5">5. 약속 8시간 전</option>
                <option value="6">6. 약속 직전 / 30분 전 (긴급)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="relation">2. 상대와의 관계</label>
            <select id="relation">
                <option value="1">1. 친밀한 관계 (친구/가족)</option>
                <option value="2">2. 평범한 관계 (친구 등등)</option>
                <option value="3">3. 딱히 친하지 않은 관계</option>
                <option value="4">4. 초면</option>
                <option value="5">5. 업무 관계</option>
            </select>
        </div>

        <div class="form-group">
            <label for="freq">3. 만나는 빈도</label>
            <select id="freq">
                <option value="1">1. 일 년에 몇 번</option>
                <option value="2">2. 몇 달에 몇 번</option>
                <option value="3">3. 일주일동안 가끔</option>
                <option value="4">4. 일주일동안 자주</option>
                <option value="5">5. 매일</option>
            </select>
        </div>

        <div class="form-group">
            <label for="personality">4. 상대 성향</label>
            <select id="personality">
                <option value="1">1. 관대함</option>
                <option value="2">2. 평범함</option>
                <option value="3">3. 엄격함</option>
                <option value="4">4. 개빡셈</option>
                <option value="5">5. 레전드</option>
            </select>
        </div>
    </div>

    <button class="btn-submit" onclick="runAlgorithm()">★ 최적 핑계 도출하기람쥐 ★</button>

    <div class="result-section" id="resultSection">
        <div class="result-title-banner">✦ 알고리즘 추천 핑계 순위 ✦</div>
        <div id="resultsContainer"></div>
    </div>
</div>

<script>
    // 핑계 데이터베이스 (결과물은 기존 형태 유지)
    const excusesDB = [
        {
            id: 'sick_stomach',
            category: '✦ 건강 / 신체 ✦',
            title: '갑작스러운 돌발성 장염 / 식중독',
            desc: '급작스러운 직전 파토에 절대적 무적 사유. 상대가 아무리 빡세도 방어 가능.',
            template: "진짜 미안해... 오늘 아침부터 속이 너무 안 좋더니 급성 장염이 온 것 같아. 지금 화장실에서 나올 수가 없을 정도라 도저히 이동을 못하겠어 ㅠㅠ 약속 너무 기다렸는데 미안해, 다음에 내가 먼저 연락할게!",
            calc: (t, r, f, p) => {
                let score = 50;
                if (t >= 4) score += 35;
                if (p >= 4) score += 15;
                if (t <= 2) score -= 40;
                return score;
            }
        },
        {
            id: 'work_emergency',
            category: '✦ 업무 / 학업 ✦',
            title: '긴급 야근 / 상사의 급작스러운 업무 지시',
            desc: '업무관계나 사회적 관계에서 명분을 챙기는 비난 방어형 사유.',
            template: "OO님/아 미안해서 어쩌지.. 갑자기 회사 쪽에 긴급 수정 건이 터져서 퇴근을 못 하거나 계속 노트북을 보고 처리해야 할 상황이 됐어. 미리 챙겼어야 했는데 변수가 생겼네.. 오늘 약속은 넘 미안해!",
            calc: (t, r, f, p) => {
                let score = 50;
                if (r === 5) score += 30;
                if (t >= 3 && t <= 5) score += 20;
                return score;
            }
        },
        {
            id: 'family_leak',
            category: '✦ 집안 / 시설 ✦',
            title: '집안 누수 / 배관 긴급 기사 방문',
            desc: '갑작스러운 집안 문제로 당일이나 하루 전 거절하기 매우 유용함.',
            template: "아 미안해!! 방금 집에 문제가 생겼어.. 배관(누수) 관련해서 기사님이 지금 급하게 오신다고 해서 집을 비울 수가 없는 상황이야. 갑자기 연락해서 정말 미안해 ㅠㅠ",
            calc: (t, r, f, p) => {
                let score = 50;
                if (t === 4 || t === 5) score += 30;
                if (f >= 4) score += 10;
                return score;
            }
        },
        {
            id: 'schedule_overlap',
            category: '✦ 일정 착오 ✦',
            title: '캘린더 중복 착오 및 선약 발견',
            desc: '약속 날짜가 많이 남아있을 때 가장 안전하고 깔끔한 사유.',
            template: "OO야 정말 미안해! 다이어리 확인하다가 내가 날짜를 완전히 착각한 걸 봤어. 그날 이미 고정으로 잡아둔 가족/회사 일정이 있더라고.. 미리 제대로 안 챙겨서 미안해. 날짜 변경 가능할까?",
            calc: (t, r, f, p) => {
                let score = 50;
                if (t <= 3) score += 40;
                if (t >= 5) score -= 50;
                if (p >= 4) score -= 20;
                return score;
            }
        },
        {
            id: 'burnout_honest',
            category: '✦ 컨디션 / 솔직 ✦',
            title: '솔직한 피로 누적 및 컨디션 난조',
            desc: '친밀도가 높거나 관대한 상대에게 유용한 어필 카드.',
            template: "OO야 정말 미안한데.. 내가 이번 주 일 일정이 너무 과했는지 피로가 너무 누적돼서 컨디션이 바닥이야. 나가서 재밌게 못 놀고 민폐만 줄 것 같아서 ㅠㅠ 염치없지만 다음에 컨디션 회복해서 더 좋은 컨디션으로 보자!",
            calc: (t, r, f, p) => {
                let score = 50;
                if (r === 1) score += 25;
                if (p === 1) score += 25;
                if (p >= 4) score -= 40;
                return score;
            }
        },
        {
            id: 'covid_flu',
            category: '✦ 건강 / 전염성 ✦',
            title: '독감 / 코로나 증상으로 인한 격리',
            desc: '상대방에게 피해를 주지 않겠다는 명분으로 모든 비난을 완벽 차단.',
            template: "OO야 오늘 가려고 준비 중이었는데 목이 너무 칼칼하고 열감이 있어서 체온 재보니까 독감 기운이 있어.. 혹시나 너한테 옮길까 봐 너무 걱정돼서 그런데, 오늘 약속 미루는 게 맞을 것 같아. 미안해 ㅠㅠ",
            calc: (t, r, f, p) => {
                let score = 50;
                if (t >= 3 && t <= 5) score += 30;
                if (p >= 3) score += 20;
                return score;
            }
        }
    ];

    function runAlgorithm() {
        const t = parseInt(document.getElementById('time').value);
        const r = parseInt(document.getElementById('relation').value);
        const f = parseInt(document.getElementById('freq').value);
        const p = parseInt(document.getElementById('personality').value);

        let list = excusesDB.map(item => {
            let finalScore = item.calc(t, r, f, p);
            finalScore = Math.max(15, Math.min(99, finalScore));
            return { ...item, score: finalScore };
        });

        list.sort((a, b) => b.score - a.score);

        const container = document.getElementById('resultsContainer');
        container.innerHTML = '';

        list.forEach((item, idx) => {
            const rank = idx + 1;

            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <span class="rank-badge">${rank}위 (${item.score}점)</span>
                <span class="reason-category">${item.category}</span>
                <div class="reason-title">${item.title}</div>
                <div class="reason-desc">${item.desc}</div>
                <div class="template-box" id="msg-${idx}">${item.template}</div>
                <div class="clearfix">
                    <button class="btn-copy" onclick="copyMessage('msg-${idx}')">카톡 메시지 복사 ✉</button>
                </div>
            `;
            container.appendChild(card);
        });

        document.getElementById('resultSection').style.display = 'block';
    }

    function copyMessage(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('카톡 메시지가 복사되었습니다람쥐! 🌹');
        });
    }
</script>

</body>
</html>
