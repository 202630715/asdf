<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온 스네이크 게임 (Retro Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0f18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 95vw;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .score-board {
            display: flex;
            gap: 20px;
        }

        .score-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            border-left: 4px solid #00ffcc;
        }

        .high-score-box {
            border-left-color: #ff007f;
        }

        .score-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }

        .score-val {
            font-size: 1.2rem;
            color: #fff;
        }

        .canvas-wrapper {
            position: relative;
        }

        canvas {
            background-color: #050608;
            border-radius: 12px;
            border: 2px solid #1f2430;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 6, 8, 0.85);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2rem;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 10px;
        }

        .overlay p {
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .btn {
            background: linear-gradient(135deg, #00ffcc, #00b894);
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Controls for Mobile */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
            width: 200px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ctrl-btn:active {
            background: rgba(0, 255, 204, 0.3);
        }

        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }

        @media (min-width: 600px) {
            .controls {
                display: none; /* Hide touch controls on desktop */
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="score-board">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-val" id="score">0</div>
                </div>
                <div class="score-box high-score-box">
                    <div class="score-label">Best</div>
                    <div class="score-val" id="highScore">0</div>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="startOverlay" class="overlay">
                <h1>NEON SNAKE</h1>
                <p>방향키(키보드) 또는 버튼으로 조작하세요</p>
                <button class="btn" onclick="startGame()">게임 시작</button>
            </div>

            <div id="gameOverOverlay" class="overlay hidden">
                <h1 style="color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.5);">GAME OVER</h1>
                <p id="finalScore">최종 점수: 0</p>
                <button class="btn" onclick="startGame()">다시하기</button>
            </div>
        </div>

        <div class="controls">
            <div class="ctrl-btn up" onclick="handleTouch('UP')">▲</div>
            <div class="ctrl-btn left" onclick="handleTouch('LEFT')">◀</div>
            <div class="ctrl-btn down" onclick="handleTouch('DOWN')">▼</div>
            <div class="ctrl-btn right" onclick="handleTouch('RIGHT')">▶</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let gameSpeed = 100;
        let isChangingDirection = false;

        highScoreEl.innerText = highScore;

        // Sound generator using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'eat') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'die') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function startGame() {
            snake = [
                { x: 10 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 9 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 8 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            scoreEl.innerText = score;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            // Make sure food doesn't spawn on snake
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function gameLoop() {
            if (isGameOver()) {
                playSound('die');
                clearInterval(gameInterval);
                finalScoreEl.innerText = `최종 점수: ${score}`;
                gameOverOverlay.classList.remove('hidden');
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreEl.innerText = highScore;
                }
                return;
            }

            isChangingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = '#050608';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#00ffcc'; // Head
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ffcc';
                } else {
                    ctx.fillStyle = '#00b894'; // Body
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(part.x, part.y, GRID_SIZE - 2, GRID_SIZE - 2);
            });
            ctx.shadowBlur = 0; // reset
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                playSound('eat');
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = '#ff007f';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff007f';
            ctx.fillRect(food.x, food.y, GRID_SIZE - 2, GRID_SIZE - 2);
            ctx.shadowBlur = 0;
        }

        function isGameOver() {
            const head = snake[0];

            // Wall collision
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function changeDirection(dir) {
            if (isChangingDirection) return;

            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingRight = dx === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;

            if (dir === 'LEFT' && !goingRight) { dx = -GRID_SIZE; dy = 0; isChangingDirection = true; }
            if (dir === 'UP' && !goingDown) { dx = 0; dy = -GRID_SIZE; isChangingDirection = true; }
            if (dir === 'RIGHT' && !goingLeft) { dx = GRID_SIZE; dy = 0; isChangingDirection = true; }
            if (dir === 'DOWN' && !goingUp) { dx = 0; dy = GRID_SIZE; isChangingDirection = true; }
        }

        // Keyboard inputs
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') changeDirection('LEFT');
            if (e.key === 'ArrowUp' || e.key === 'w') changeDirection('UP');
            if (e.key === 'ArrowRight' || e.key === 'd') changeDirection('RIGHT');
            if (e.key === 'ArrowDown' || e.key === 's') changeDirection('DOWN');
        });

        // Touch control handler
        function handleTouch(dir) {
            changeDirection(dir);
        }
    </script>
</body>
</html>
